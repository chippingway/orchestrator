[project]
name = "chipping-orchestrator"
version = "0.11.1"
description = "GitHub-Issue-driven AI agent workflow."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyGithub>=2.1", "psycopg[binary]>=3.3.4"]

[project.scripts]
chipping-orchestrator = "orchestrator.cli:main"

# A console script is only installed for a built project, so the flat-layout
# `orchestrator` package is declared explicitly here; auto-discovery would
# otherwise trip over the sibling `tests`/`docs` directories.
[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.3", "wemake-python-styleguide>=1.7.1"]
# Streamlit, Plotly, and Streamlit's transitive pandas are only needed
# by the analytics dashboard (`orchestrator/apps/analytics_dashboard.py`
# and the chart owners under
# `orchestrator/observability/dashboard/charts/`). They are NOT in
# the default `dev` group so `uv sync --locked` keeps installing the
# orchestrator's runtime + tests minimal; install with
# `uv sync --group dashboard` before running
# `uv run streamlit run orchestrator/apps/analytics_dashboard.py`.
dashboard = ["streamlit>=1.61.1", "plotly>=6.9.0"]

[tool.pytest.ini_options]
# Surface skip reasons in the run summary by default. The suite carries
# two intentional skip families -- the optional Plotly dashboard chart
# tests and the opt-in live-Postgres analytics integration class -- and
# under the default `pytest` invocation they collapse to a bare "N skipped"
# line that hides their `_SKIP_REASON` / `SkipTest` messages.
# The --ignore keeps a bare `pytest` from recursing into the operator-owned
# `analytics-db/data/` Docker bind mount, which may be unreadable and would
# otherwise abort collection with a PermissionError on a phantom conftest.py.
addopts = ["-rs", "--ignore=analytics-db/data"]
# Restrict default discovery to the tracked test tree so bare `pytest` and
# `pytest tests` collect the same inventory without probing runtime volumes.
testpaths = ["tests"]

[tool.ruff]
# Repository-wide line-length target. Ruff enforces it for Python (E501,
# enabled below); `tests/repository/test_line_length.py` reads this same value to
# enforce it for tracked Markdown/text files, so 120 lives in one place.
line-length = 120

[tool.ruff.lint]
# Keep the lint contract independent of changes to Ruff's default rule set.
select = ["E4", "E7", "E9", "F"]
# E501 (line too long) is not in the selected baseline; opt into it so
# the line-length target above is actually enforced.
extend-select = ["E501"]
# The two rules a `# noqa` in this tree names but the selected set does not
# enable: BLE001 on the blind handlers that must stay blind, N802 on the one
# test double that mimics a third-party method name. Naming them keeps RUF100
# from reading those directives as dead, and leaves each live for the audit it
# was written for -- `ruff check orchestrator tests --select=BLE001` still
# honours every one of them.
external = ["BLE001", "N802"]

# PLC0414 (`import X as X`) sits outside the baseline above, and the audit
# that runs it -- `ruff check orchestrator tests --select=PLC0414` -- reads
# these entries. The rule stands against the convention F401 is answered
# with here: a same-name alias is what declares an import an explicit
# re-export, and the import that drops it is what F401 reports as dead. Each
# path below is a module whose job is to bind names it does not itself read
# -- the theme a dashboard page hands every panel, and the stage fixtures a
# sibling test module reaches its scenario types through -- so every alias in
# it is load-bearing. Exact paths rather than a glob, so a neighbouring or
# future module is still held to the rule: an alias on a name its own module
# already reads earns no F401 exemption and is removed instead.
[tool.ruff.lint.per-file-ignores]
"orchestrator/observability/dashboard/theme.py" = ["PLC0414"]
"tests/workflow/stages/conflicts/conflict_resume_test_support.py" = ["PLC0414"]
"tests/workflow/stages/conflicts/content_update_support.py" = ["PLC0414"]
"tests/workflow/stages/decomposition/late_run_support.py" = ["PLC0414"]
"tests/workflow/stages/fixing/published_gate_support.py" = ["PLC0414"]
"tests/workflow/stages/validating/recovered_gate_support.py" = ["PLC0414"]
