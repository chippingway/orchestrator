name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install from lock
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check orchestrator tests

      - name: Lint (wemake-python-styleguide)
        run: uv run flake8 orchestrator tests --select=WPS

      - name: Tests (pytest)
        run: uv run python -m pytest tests --cov=orchestrator --cov-report=term-missing
