version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    labels:
      - "workflow:dependencies"
      - "workflow:github_actions"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    labels:
      - "workflow:dependencies"
      - "workflow:python:uv"
